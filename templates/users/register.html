{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7 col-lg-5">
        <div class="card">
            <div class="card-body p-4">
                <h1 class="h4 mb-4">Create a HANS account</h1>
                <form method="POST">
                    {% csrf_token %}
                    {{ form.as_div }}
                    <button type="submit" class="btn btn-primary w-100">Register</button>
                </form>
            </div>
        </div>
        <p class="text-center mt-3 text-secondary">Already registered? <a href="{% url 'users:login' %}">Log in</a></p>
    </div>
</div>
{% endblock %}
