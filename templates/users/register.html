{% extends "base.html" %}
{% block content %}
<div style="max-width: 450px; margin: 50px auto;">
    <div class="card">
        <h2 style="margin-bottom: 20px;">Create a HANS account</h2>
        <form method="POST">
            {% csrf_token %}
            {{ form.as_div }}
            <button type="submit" class="btn btn-primary">Register</button>
        </form>
        <p style="margin-top: 15px;">Already registered? <a href="{% url 'users:login' %}">Log in</a></p>
    </div>
</div>
{% endblock %}
